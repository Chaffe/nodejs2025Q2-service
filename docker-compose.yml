version: '3.8'

services:
  app:
    build:
      context: .
      dockerfile: Dockerfile
      target: development
    container_name: home-library-app
    restart: always
    ports:
      - '${PORT:-4000}:4000'
    environment:
      - PORT=${PORT:-4000}
      - POSTGRES_HOST=postgres
      - POSTGRES_PORT=5432
      - POSTGRES_USER=${POSTGRES_USER:-postgres}
      - POSTGRES_PASSWORD=${POSTGRES_PASSWORD:-postgres}
      - POSTGRES_DB=${POSTGRES_DB:-home_library}
      - TYPEORM_SYNCHRONIZE=${TYPEORM_SYNCHRONIZE:-false}
      - TYPEORM_LOGGING=${TYPEORM_LOGGING:-false}
    volumes:
      - ./src:/app/src
      - ./doc:/app/doc
    depends_on:
      postgres:
        condition: service_healthy
    networks:
      - home-library-network

  postgres:
    image: postgres:16-alpine
    container_name: home-library-db
    restart: always
    ports:
      - '${POSTGRES_PORT:-5432}:5432'
    environment:
      - POSTGRES_USER=${POSTGRES_USER:-postgres}
      - POSTGRES_PASSWORD=${POSTGRES_PASSWORD:-postgres}
      - POSTGRES_DB=${POSTGRES_DB:-home_library}
    volumes:
      - postgres-data:/var/lib/postgresql/data
      - postgres-logs:/var/log/postgresql
    healthcheck:
      test: ['CMD-SHELL', 'pg_isready -U ${POSTGRES_USER:-postgres} -d ${POSTGRES_DB:-home_library}']
      interval: 5s
      timeout: 5s
      retries: 5
    networks:
      - home-library-network

networks:
  home-library-network:
    driver: bridge

volumes:
  postgres-data:
  postgres-logs: